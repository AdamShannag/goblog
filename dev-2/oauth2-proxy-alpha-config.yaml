injectRequestHeaders:
  - name: X-Forwarded-Groups
    values:
      - claim: groups
  - name: X-Forwarded-User
    values:
      - claim: user
  - name: X-Forwarded-Email
    values:
      - claim: email
  - name: X-Forwarded-Preferred-Username
    values:
      - claim: preferred_username
metricsServer:
  BindAddress: ""
  SecureBindAddress: ""
  TLS: null
providers:
  - ADFSConfig: {}
    azureConfig:
      tenant: common
    backendLogoutURL: ""
    bitbucketConfig: {}
    clientID: oauth2-proxy
    clientSecret: 72341b6d-7065-4518-a0e4-50ee15025608
    githubConfig: {}
    gitlabConfig: {}
    googleConfig: {}
    id: Keycloak
    keycloakConfig: {}
    loginGovConfig: {}
    loginURLParameters:
      - default:
          - force
        name: approval_prompt
    name: Keycloak
    oidcConfig:
      audienceClaims:
        - aud
      emailClaim: email
      groupsClaim: groups
      insecureSkipNonce: true
      issuerURL: http://keycloak.localtest.me:9080/realms/oauth2-proxy
      userIDClaim: email
    provider: oidc
server:
  BindAddress: 0.0.0.0:4180
  SecureBindAddress: ""
  TLS: null
upstreamConfig:
  upstreams:
    - flushInterval: 1s
      id: /
      passHostHeader: true
      path: /
      proxyWebSockets: true
      timeout: 30s
      uri: http://simple-proxy
